name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f flutter_app.zip ]; then
            unzip flutter_app.zip
            mv flutter_app/* . 2>/dev/null || true
            mv flutter_app/.* . 2>/dev/null || true
            rm flutter_app.zip
          fi

      - name: Safely fix pubspec.yaml SDK version
        run: |
          # 使用 Python 安全地只修改 environment 下的 sdk 版本要求
          python3 -c "
          import re
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()
          # 精准匹配 environment: 下方的 sdk 行
          content = re.sub(r'(environment:\s*\n\s*sdk:\s*)[^\n]+', r'\1\">=3.0.0 <4.0.0\"', content)
          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          echo "=== 修改后的 pubspec.yaml 环境配置 ==="
          grep -A 2 "environment:" pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
