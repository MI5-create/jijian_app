name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. 解压你上传的压缩包
      - name: Extract ZIP
        run: |
          if [ -f flutter_app.zip ]; then
            unzip flutter_app.zip
            if [ -d "flutter_app" ]; then
              cp -r flutter_app/* .
              cp -r flutter_app/.[!.]* . 2>/dev/null || true
              rm -rf flutter_app
            fi
            rm flutter_app.zip
          fi

      # 2. 强制修复 Gradle 下载地址（用官方海外源，光速下载）
      - name: Fix Gradle Wrapper
        run: |
          cd android
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-all.zip|' gradle/wrapper/gradle-wrapper.properties
          cd ..
          
      # 3. 配置 Java 17（最稳定的版本）
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. 配置 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 5. 开始打包
      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
          
      # 6. 打包成功后，把 APK 传上来
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
