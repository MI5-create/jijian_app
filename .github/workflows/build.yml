name: Build APK Safely
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Standard Environment and Build
        run: |
          # 1. 解压你上传的压缩包
          if [ -f flutter_app.zip ]; then
            unzip flutter_app.zip
          fi
          
          # 2. 提取你写的心血（lib源码和依赖）
          SRC_DIR="."
          if [ -d "flutter_app/lib" ]; then SRC_DIR="flutter_app"; fi
          
          mkdir -p /tmp/my_lib
          cp -r $SRC_DIR/lib/* /tmp/my_lib/
          cp $SRC_DIR/pubspec.yaml /tmp/pubspec.yaml || true
          
          # 3. 核心大招：用官方命令生成绝对纯净的安卓外壳
          flutter create clean_app --project-name jijian_app --platforms android
          
          # 4. 把你的源码装进新外壳里
          cp -r /tmp/my_lib/* clean_app/lib/
          cp /tmp/pubspec.yaml clean_app/ || true
          
          # 5. 开始真正的打包！
          cd clean_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: clean_app/build/app/outputs/flutter-apk/*.apk
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: clean_app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.0
          draft: false
          prerelease: false
